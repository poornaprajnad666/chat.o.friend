<div class="floating-objects">
  <div class="object object-1"></div>
  <div class="object object-2"></div>
</div>

<div class="theme-selector-container">
  <div class="custom-dropdown">
    <div class="dropdown-trigger">
      <span class="theme-circle" [ngClass]="themeService.currentTheme()"></span>
      {{ themeService.currentTheme() | titlecase }}
      <svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
    </div>
    <div class="dropdown-menu">
      <div *ngFor="let t of themes" class="dropdown-item" (click)="themeService.setTheme(t)">
        <span class="theme-circle" [ngClass]="t"></span>
        {{ t | titlecase }}
      </div>
    </div>
  </div>
</div>

<div class="hero-section animate-fade-in content-box">
  <h1>chat.o.friend</h1>
  <p>The most elegant way to connect with your friends instantly.</p>
  
  <div class="glass-card join-box p-8">
    <div class="input-group-vertical">
      <input 
        [(ngModel)]="username" 
        (keyup.enter)="join()" 
        placeholder="What's your name?" 
        autofocus
      />
      <button (click)="join()" [disabled]="!username.trim()" class="mt-4 w-full">
        Get Started
      </button>
    </div>
  </div>
</div>
